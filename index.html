<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R4X Proximity Voice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --green: #3fb950;
    --green-dim: #1a4428;
    --red: #f85149;
    --red-dim: #3d1a1a;
    --yellow: #d29922;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --blue: #388bfd;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 32px; height: 32px;
    background: var(--green);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header span { font-size: 13px; color: var(--text-muted); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    margin-left: auto;
    transition: background 0.3s;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* JOIN SCREEN */
  #join-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .join-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  .join-card h2 { font-size: 20px; margin-bottom: 8px; }
  .join-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-group label { font-size: 13px; font-weight: 500; }
  .input-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--green); }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-green { background: var(--green); color: #000; }
  .btn-green:hover { opacity: 0.9; }
  .btn-red { background: var(--red); color: #fff; }

  /* MAIN APP */
  #app-screen {
    flex: 1;
    display: none;
    flex-direction: column;
  }

  /* TOP BAR */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .room-info { font-size: 13px; color: var(--text-muted); }
  .room-info strong { color: var(--text); }

  .btn-small {
    padding: 7px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-leave { background: var(--red-dim); color: var(--red); margin-left: auto; }
  .btn-mute-self { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-mute-self.muted { background: var(--red-dim); color: var(--red); border-color: var(--red); }

  /* PLAYERS LIST */
  .players-section {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .player-card.speaking {
    border-color: var(--green);
    background: var(--green-dim);
  }
  .player-card.too-far {
    opacity: 0.5;
  }

  .player-avatar {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .player-info { flex: 1; min-width: 0; }
  .player-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-dist { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .vol-bar {
    width: 60px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .vol-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .btn-mute-player {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .btn-mute-player.muted {
    background: var(--red-dim);
    color: var(--red);
    border-color: var(--red);
  }

  /* ME card */
  .me-card {
    background: var(--surface2);
    border: 1px solid var(--blue);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .me-badge {
    font-size: 10px;
    background: var(--blue);
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: 700;
  }

  /* PROXIMITY INDICATOR */
  .proximity-ring {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--green-dim) 0%, transparent 70%);
    border: 2px solid var(--green);
    position: relative;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  /* LOG */
  .log {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-muted);
    max-height: 60px;
    overflow-y: auto;
  }

  /* NO PLUGIN MODE */
  .manual-pos {
    background: var(--surface2);
    border: 1px solid var(--yellow);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .manual-pos p { color: var(--yellow); margin-bottom: 8px; }
  .coord-inputs { display: flex; gap: 8px; }
  .coord-inputs input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    min-width: 0;
  }
  .coord-inputs button {
    padding: 7px 12px;
    background: var(--yellow);
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }

  /* Room tabs */
  .room-tab {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .room-tab.active {
    background: var(--green-dim);
    color: var(--green);
    border-color: var(--green);
  }

  /* Animations */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(63,185,80,0); }
  }
  .speaking .player-avatar { animation: pulse 1s infinite; }

  /* Mobile */
  @media (max-width: 480px) {
    .join-card { padding: 24px 20px; }
    .vol-bar { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎮</div>
  <div>
    <h1>R4X Proximity Voice</h1>
    <span>Minecraft Bedrock</span>
  </div>
  <div class="status-dot" id="statusDot"></div>
</header>

<!-- JOIN -->
<div id="join-screen">
  <div class="join-card">
    <h2>Join Voice Chat</h2>
    <p>Apna Minecraft username enter karo, phir join karo.</p>

    <div class="input-group">
      <label>Minecraft Username</label>
      <input type="text" id="usernameInput" placeholder="e.g. R4XGAMEZ" autocomplete="off" />
    </div>
    <div class="input-group">
      <label>Room</label>
      <div style="display:flex;gap:8px;margin-bottom:4px;">
        <button class="room-tab active" id="tabGlobal" onclick="selectTab('global')">🌐 Global</button>
        <button class="room-tab" id="tabCustom" onclick="selectTab('custom')">🔒 Custom Room</button>
      </div>
      <input type="text" id="roomInput" placeholder="Room name daalo..." autocomplete="off" style="display:none;" />
      <p id="globalHint" style="font-size:12px;color:var(--text-muted);margin-top:4px;">Sab log ek saath — default global room</p>
    </div>

    <button class="btn btn-green" id="joinBtn">🎤 Join Voice</button>
    <p style="font-size:12px;color:var(--text-muted);margin-top:12px;text-align:center;">
      Mic permission maangega — Allow karo
    </p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="room-info">Room: <strong id="roomLabel">main</strong></div>
    <button class="btn-small btn-mute-self" id="muteSelfBtn">🎤 Mic ON</button>
    <button class="btn-small btn-leave" id="leaveBtn">Leave</button>
  </div>

  <div class="players-section">
    <!-- Me card -->
    <div class="me-card">
      <div class="player-avatar">🧍</div>
      <div class="player-info">
        <div class="player-name" id="myNameLabel">—</div>
        <div class="player-dist">You</div>
      </div>
      <span class="me-badge">ME</span>
    </div>

    <!-- Manual position (if no plugin) -->
    <div class="manual-pos" id="manualPosBox">
      <p>⚠️ Plugin nahi mila — manually coordinates update karo:</p>
      <div class="coord-inputs">
        <input type="number" id="manX" placeholder="X" />
        <input type="number" id="manY" placeholder="Y" />
        <input type="number" id="manZ" placeholder="Z" />
        <button onclick="updateManualPos()">Set</button>
      </div>
    </div>

    <div class="section-title">Players in Voice</div>
    <div id="playersList"></div>
  </div>

  <div class="log" id="logBox">Waiting...</div>
</div>

<script>
// !! CHANGE THIS to your deployed Cloudflare Worker URL !!
const WORKER_URL = "https://r4x-proximity-voice.YOUR_SUBDOMAIN.workers.dev";

let selectedTab = 'global';
function selectTab(tab) {
  selectedTab = tab;
  document.getElementById('tabGlobal').classList.toggle('active', tab === 'global');
  document.getElementById('tabCustom').classList.toggle('active', tab === 'custom');
  document.getElementById('roomInput').style.display = tab === 'custom' ? 'block' : 'none';
  document.getElementById('globalHint').style.display = tab === 'global' ? 'block' : 'none';
}
const WS_BASE = WORKER_URL.replace("https://", "wss://").replace("http://", "ws://") + "/ws";
let WS_URL = WS_BASE + "?room=global";

// Proximity settings (blocks)
const FADE_START = 5;   // start fading at 5 blocks
const FADE_END = 20;    // silent at 20 blocks
const CUTOFF = 25;      // completely cut off at 25 blocks

let myUsername = "";
let myPos = { x: 0, y: 64, z: 0, world: "world" };
let ws = null;
let localStream = null;
let selfMuted = false;
let peers = {};        // username -> { pc, audioEl, muted, pos, gainNode }
let positions = {};    // username -> {x,y,z,world}
let pluginActive = false;
let audioCtx = null;

// UI refs
const joinScreen = document.getElementById('join-screen');
const appScreen = document.getElementById('app-screen');
const statusDot = document.getElementById('statusDot');
const playersList = document.getElementById('playersList');
const logBox = document.getElementById('logBox');
const muteSelfBtn = document.getElementById('muteSelfBtn');
const manualPosBox = document.getElementById('manualPosBox');

function log(msg) {
  logBox.textContent = msg;
}

// ─── JOIN ───────────────────────────────────────────────────────────────────
document.getElementById('joinBtn').addEventListener('click', async () => {
  const username = document.getElementById('usernameInput').value.trim();
  if (!username) { alert("Username daalo!"); return; }
  myUsername = username;
  document.getElementById('myNameLabel').textContent = username;
  const roomName = selectedTab === 'global' ? 'global' : (document.getElementById('roomInput').value.trim() || 'global');
  document.getElementById('roomLabel').textContent = roomName;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    log("Mic connected ✓");
  } catch (e) {
    alert("Mic access nahi mila: " + e.message);
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  joinScreen.style.display = 'none';
  appScreen.style.display = 'flex';

  const room = document.getElementById('roomLabel').textContent || 'global';
  WS_URL = WS_BASE + "?room=" + encodeURIComponent(room);
  connectWS();
});

// ─── WEBSOCKET ───────────────────────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    statusDot.classList.add('connected');
    log("Server se connected ✓");
    const room = document.getElementById('roomLabel').textContent || 'global';
    ws.send(JSON.stringify({ type: 'join', username: myUsername, room }));

    // Send my position every 2 seconds via WS
    setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'positions', ...myPos }));
      }
    }, 2000);
  };

  ws.onmessage = async (e) => {
    const data = JSON.parse(e.data);

    if (data.type === 'players') {
      // Initial player list
      for (const name of data.players) {
        if (name !== myUsername) await ensurePeer(name, true);
      }
    }

    if (data.type === 'joined') {
      if (data.username !== myUsername) {
        log(data.username + " joined");
        await ensurePeer(data.username, true); // we initiate offer
      }
    }

    if (data.type === 'left') {
      removePeer(data.username);
      log(data.username + " left");
    }

    if (data.type === 'positions') {
      positions = data.players;
      updateProximity();
      // If plugin is sending data, hide manual box
      pluginActive = true;
      manualPosBox.style.display = 'none';
    }

    if (data.type === 'offer') {
      await handleOffer(data.from, data.sdp);
    }
    if (data.type === 'answer') {
      await peers[data.from]?.pc?.setRemoteDescription({ type: 'answer', sdp: data.sdp });
    }
    if (data.type === 'ice') {
      try { await peers[data.from]?.pc?.addIceCandidate(data.candidate); } catch {}
    }
  };

  ws.onclose = () => {
    statusDot.classList.remove('connected');
    log("Disconnected. Reconnecting...");
    setTimeout(connectWS, 3000);
  };
}

// ─── WEBRTC ──────────────────────────────────────────────────────────────────
async function ensurePeer(username, initiator) {
  if (peers[username]) return;

  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  });

  // Create gain node for proximity volume
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 1;
  gainNode.connect(audioCtx.destination);

  peers[username] = { pc, gainNode, muted: false, pos: null };

  // Add local tracks
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  // Handle remote audio
  pc.ontrack = (e) => {
    const source = audioCtx.createMediaStreamSource(new MediaStream([e.track]));
    source.connect(gainNode);
    peers[username].source = source;
    log(username + " audio connected");
  };

  // ICE candidates
  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'ice', target: username, candidate: e.candidate }));
    }
  };

  if (initiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', target: username, sdp: offer.sdp }));
  }

  renderPlayerCard(username);
}

async function handleOffer(from, sdp) {
  await ensurePeer(from, false);
  const pc = peers[from].pc;
  await pc.setRemoteDescription({ type: 'offer', sdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: 'answer', target: from, sdp: answer.sdp }));
}

function removePeer(username) {
  if (peers[username]) {
    peers[username].pc.close();
    delete peers[username];
  }
  const card = document.getElementById('card-' + username);
  if (card) card.remove();
}

// ─── PROXIMITY ───────────────────────────────────────────────────────────────
function distance(a, b) {
  if (!a || !b) return 999;
  if (a.world && b.world && a.world !== b.world) return 999;
  const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

function updateProximity() {
  const myPosition = positions[myUsername] || myPos;

  for (const [username, peer] of Object.entries(peers)) {
    const otherPos = positions[username];
    const dist = distance(myPosition, otherPos);

    // Calculate volume
    let vol = 0;
    if (dist <= FADE_START) {
      vol = 1;
    } else if (dist < FADE_END) {
      vol = 1 - ((dist - FADE_START) / (FADE_END - FADE_START));
    } else {
      vol = 0;
    }

    const cutOff = dist >= CUTOFF;

    if (!peer.muted) {
      if (peer.gainNode) {
        peer.gainNode.gain.setTargetAtTime(cutOff ? 0 : vol, audioCtx.currentTime, 0.1);
      }
    }

    // Update card UI
    const distEl = document.getElementById('dist-' + username);
    const volFill = document.getElementById('vol-' + username);
    const card = document.getElementById('card-' + username);

    if (distEl) {
      if (!otherPos) {
        distEl.textContent = "Pos unknown";
      } else if (cutOff) {
        distEl.textContent = `${Math.round(dist)} blocks — too far`;
      } else {
        distEl.textContent = `${Math.round(dist)} blocks`;
      }
    }
    if (volFill) volFill.style.width = (vol * 100) + '%';
    if (card) {
      card.classList.toggle('too-far', cutOff);
    }
  }
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderPlayerCard(username) {
  if (document.getElementById('card-' + username)) return;

  const card = document.createElement('div');
  card.className = 'player-card';
  card.id = 'card-' + username;
  card.innerHTML = `
    <div class="player-avatar">🧑</div>
    <div class="player-info">
      <div class="player-name">${escHtml(username)}</div>
      <div class="player-dist" id="dist-${username}">—</div>
    </div>
    <div class="vol-bar"><div class="vol-fill" id="vol-${username}" style="width:100%"></div></div>
    <button class="btn-mute-player" id="muteBtn-${username}" onclick="toggleMutePlayer('${username}')">🔊 Mute</button>
  `;
  playersList.appendChild(card);
}

function toggleMutePlayer(username) {
  if (!peers[username]) return;
  const peer = peers[username];
  peer.muted = !peer.muted;

  if (peer.gainNode) {
    peer.gainNode.gain.setTargetAtTime(peer.muted ? 0 : 1, audioCtx.currentTime, 0.05);
  }

  const btn = document.getElementById('muteBtn-' + username);
  if (btn) {
    btn.textContent = peer.muted ? '🔇 Unmute' : '🔊 Mute';
    btn.classList.toggle('muted', peer.muted);
  }
  log(peer.muted ? `${username} muted` : `${username} unmuted`);
}

// ─── SELF MUTE ───────────────────────────────────────────────────────────────
muteSelfBtn.addEventListener('click', () => {
  selfMuted = !selfMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !selfMuted);
  muteSelfBtn.textContent = selfMuted ? '🔇 Mic OFF' : '🎤 Mic ON';
  muteSelfBtn.classList.toggle('muted', selfMuted);
});

// ─── LEAVE ───────────────────────────────────────────────────────────────────
document.getElementById('leaveBtn').addEventListener('click', () => {
  ws?.close();
  for (const u of Object.keys(peers)) removePeer(u);
  localStream?.getTracks().forEach(t => t.stop());
  appScreen.style.display = 'none';
  joinScreen.style.display = 'flex';
  statusDot.classList.remove('connected');
});

// ─── MANUAL POS ──────────────────────────────────────────────────────────────
function updateManualPos() {
  const x = parseFloat(document.getElementById('manX').value) || 0;
  const y = parseFloat(document.getElementById('manY').value) || 64;
  const z = parseFloat(document.getElementById('manZ').value) || 0;
  myPos = { x, y, z, world: 'world' };
  log(`Position set: ${x}, ${y}, ${z}`);
  updateProximity();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
